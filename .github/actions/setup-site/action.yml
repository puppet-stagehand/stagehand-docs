name: Setup Stagehand site
description: Install the pinned Node toolchain and site dependencies

inputs:
  install-playwright:
    description: Install Chromium and its operating-system dependencies for browser verification
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm

    - name: Install ripgrep
      shell: bash
      run: |
        if ! command -v rg >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install --yes ripgrep
        fi

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Playwright Chromium
      if: inputs.install-playwright == 'true'
      shell: bash
      run: npx playwright install --with-deps chromium
