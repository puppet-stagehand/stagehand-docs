name: Infrastructure

on:
  pull_request:
    paths:
      - infra/**
      - .github/workflows/infrastructure.yml
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment to apply
        required: true
        type: choice
        options:
          - testpilots
          - beta
          - stable
      confirmation:
        description: Type apply to confirm a fresh plan and apply
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate OpenTofu
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version

      - name: Validate configuration locally
        shell: bash
        run: |
          set -euo pipefail
          tofu fmt -check -recursive infra
          scripts/check-tofu-tags.sh
          tofu -chdir=infra/modules/static-site init -backend=false
          tofu -chdir=infra/modules/static-site test
          for root in infra/bootstrap infra/environments/testpilots infra/environments/beta infra/environments/stable; do
            tofu -chdir="$root" init -backend=false
            tofu -chdir="$root" validate
            tofu -chdir="$root" test
          done

  plan:
    name: Plan ${{ matrix.environment }}
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment:
          - testpilots
          - beta
          - stable
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check plan configuration
        id: plan_configuration
        env:
          AWS_INFRASTRUCTURE_PLAN_ROLE_ARN: ${{ vars.AWS_INFRASTRUCTURE_PLAN_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ vars.OIDC_PROVIDER_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
        shell: bash
        run: |
          if [[ -n "$AWS_INFRASTRUCTURE_PLAN_ROLE_ARN" && -n "$OIDC_PROVIDER_ARN" && -n "$HOSTED_ZONE_ID" && -n "$TOFU_STATE_BUCKET" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'AWS plan skipped: the protected Environment is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out source
        if: steps.plan_configuration.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        if: steps.plan_configuration.outputs.configured == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version

      - name: Configure AWS credentials
        if: steps.plan_configuration.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Create value-free plan summary
        if: steps.plan_configuration.outputs.configured == 'true'
        env:
          TF_VAR_github_oidc_provider_arn: ${{ vars.OIDC_PROVIDER_ARN }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
        shell: bash
        working-directory: infra/environments/${{ matrix.environment }}
        run: |
          set -euo pipefail
          tofu init \
            -backend-config="bucket=$TOFU_STATE_BUCKET" \
            -backend-config='key=stagehand-docs/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true'
          tofu plan -out=tfplan
          tofu show -json tfplan | jq -r '
            [.resource_changes[]? | .change.actions | join("/")]
            | group_by(.)
            | .[]
            | "count\t\(.[0])\t\(length)"
          ' > plan-summary.txt
          tofu show -json tfplan | jq -r '
            .resource_changes[]?
            | "resource\t\(.address)\t\(.change.actions | join("/"))"
          ' >> plan-summary.txt

      - name: Upload value-free plan summary
        if: steps.plan_configuration.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tofu-plan-${{ matrix.environment }}
          path: infra/environments/${{ matrix.environment }}/plan-summary.txt
          if-no-files-found: error
          retention-days: 7

  authorize_dispatch:
    name: Authorize infrastructure dispatch
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require manual dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          if [[ "$WORKFLOW_REF" != 'refs/heads/main' ]]; then
            echo 'Manual infrastructure applies must run from the main workflow ref.' >&2
            exit 1
          fi

  apply:
    name: Apply ${{ inputs.environment }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'apply'
    needs:
      - validate
      - authorize_dispatch
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require environment configuration
        env:
          AWS_INFRASTRUCTURE_APPLY_ROLE_ARN: ${{ vars.AWS_INFRASTRUCTURE_APPLY_ROLE_ARN }}
          OIDC_PROVIDER_ARN: ${{ vars.OIDC_PROVIDER_ARN }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
        shell: bash
        run: |
          if [[ -z "$AWS_INFRASTRUCTURE_APPLY_ROLE_ARN" || -z "$OIDC_PROVIDER_ARN" || -z "$HOSTED_ZONE_ID" || -z "$TOFU_STATE_BUCKET" ]]; then
            echo 'The selected protected Environment is missing required infrastructure variables.' >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: .opentofu-version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-2' }}

      - name: Create and apply fresh plan
        env:
          TF_VAR_github_oidc_provider_arn: ${{ vars.OIDC_PROVIDER_ARN }}
          TF_VAR_hosted_zone_id: ${{ vars.HOSTED_ZONE_ID }}
          TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-2' }}
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
          TOFU_STATE_BUCKET: ${{ vars.TOFU_STATE_BUCKET }}
        shell: bash
        working-directory: infra/environments/${{ inputs.environment }}
        run: |
          set -euo pipefail
          tofu init \
            -backend-config="bucket=$TOFU_STATE_BUCKET" \
            -backend-config='key=stagehand-docs/terraform.tfstate' \
            -backend-config="region=$AWS_REGION" \
            -backend-config='encrypt=true' \
            -backend-config='use_lockfile=true'
          tofu plan -out=tfplan
          tofu apply tfplan
